    function createCardHTML(post) {
        return `
        <div class="col-md-4">
            <div class="card h-100 text-light overflow-hidden" onclick="openReader('${post.title}', '${post.image}')">
                <span class="badge bg-danger badge-cat">${post.cat}</span>
                <img src="${post.image}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">${post.title}</h5>
                </div>
            </div>
        </div>`;
    }

    function filterCategory(cat) {
        const mainGrid = document.getElementById('main-grid');
        const driversGrid = document.getElementById('drivers-grid');
        const driversTitle = document.getElementById('drivers-title');

        mainGrid.innerHTML = '';
        driversGrid.innerHTML = '';

        if (cat === 'All') {
            driversTitle.style.display = 'block';
            const mainPosts = blogPosts.filter(post => post.cat !== 'Drivers');
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            
            mainPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else if (cat === 'Drivers') {
            driversTitle.style.display = 'block';
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else {
            driversTitle.style.display = 'none';
            const filteredPosts = blogPosts.filter(post => post.cat === cat);
            filteredPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
        }
    }

    function getContent(title) {
        // DRIVER BIOS
        if (title.includes("Niki Lauda")) return `Andreas Nikolaus "Niki" Lauda (22 February 1949 – 20 May 2019) was an Austrian racing driver, motorsport executive, and aviation entrepreneur, who competed in Formula One from 1971 to 1979 and from 1982 to 1985. Lauda won three Formula One World Drivers' Championship titles and—at the time of his retirement—held the record for most podium finishes (54); he won 25 Grands Prix across 13 seasons, and remains the only driver to have won a World Drivers' Championship with both Ferrari and McLaren.<br><br>While leading the 1976 championship—amid a fierce title battle with James Hunt—Lauda was seriously injured during the German Grand Prix at the Nürburgring, suffering severe burns and other life-changing injuries when his Ferrari 312T2 caught fire during a crash. He returned to racing six weeks later at the Italian Grand Prix, eventually losing the title to Hunt by one point. Lauda remained at Ferrari in 1977, winning several races on the way to his second championship and clinching the title.`;

        if (title.includes("James Hunt")) return `James Simon Wallis Hunt (29 August 1947 – 15 June 1993) was a British racing driver and broadcaster who competed in Formula One from 1973 to 1979. Nicknamed "the Shunt", Hunt won the Formula One World Drivers' Championship in 1976 with McLaren and won 10 Grands Prix across seven seasons. Hunt earned notoriety throughout his early career for his reckless and action-packed exploits on track, along with his playboy lifestyle off it.<br><br>Amidst a fierce title battle with Niki Lauda, Hunt won the World Drivers' Championship by a single point in his debut season with McLaren. He won several further races in 1977, dropping to fifth in the standings amidst reliability issues. After a winless 1978 season for McLaren, Hunt moved to Wolf in 1979 and retired after the Monaco Grand Prix, having achieved 10 race wins, 14 pole positions, eight fastest laps, and 23 podiums in Formula One.`;
        if (title.includes("Sebastian Vettel")) return `Sebastian Vettel is a German racing driver who competed in Formula One from 2007 to 2022. Vettel won four Formula One World Drivers' Championship titles, which he won consecutively from 2010 to 2013 with Red Bull, and remains the youngest-ever World Drivers' Champion; he won 53 Grands Prix across 16 seasons.<br><br>A test driver for BMW Sauber since 2006, Vettel made his Formula One debut at the 2007 United States Grand Prix. Vettel replaced Scott Speed at Toro Rosso after the European Grand Prix for the remainder of the 2007 season, as part of the Red Bull Junior Team. Retaining his seat for 2008, Vettel achieved his maiden pole position and victory at the Italian Grand Prix to become the then-youngest driver to win a Formula One Grand Prix. Vettel was promoted to parent team Red Bull in 2009, taking several wins as he finished runner-up to Jenson Button in the World Drivers' Championship. After winning the title-deciding Abu Dhabi Grand Prix in 2010, Vettel became the youngest-ever Formula One World Drivers' Champion, aged 23. He won his second and third championships in 2011 and 2012, dominating the former and winning the latter amidst a close title battle with Fernando Alonso.`;
        if (title.includes("Ayrton Senna")) return `Ayrton Senna da Silva (21 March 1960 – 1 May 1994) was a Brazilian racing driver who competed in Formula One from 1984 to 1994. Senna won three Formula One World Drivers' Championship titles with McLaren, and—at the time of his death—held the record for most pole positions (65), among others; he won 41 Grands Prix across 11 seasons.<br><br>Senna signed for Toleman in 1984, making his Formula One debut at the Brazilian Grand Prix. After scoring several podium finishes in his rookie season, Senna moved to Lotus in 1985 to replace Nigel Mansell, taking his maiden pole position and victory at the rain-affected Portuguese Grand Prix, a feat he repeated in Belgium. He remained at Lotus for his 1986 and 1987 campaigns, scoring multiple wins in each and finishing third in the latter World Drivers' Championship. Senna signed for McLaren in 1988 to partner Alain Prost. During the 1994 San Marino Grand Prix at Imola, Senna was killed in a crash whilst leading the race, driving the Williams FW16. His state funeral was attended by over a million people. Following subsequent safety reforms.`;
        if (title.includes("Alain Prost")) return `Alain Marie Pascal Prost (born 24 February 1955) is a French former racing driver and motorsport executive, who competed in Formula One from 1980 to 1993. Nicknamed "the Professor", Prost won four Formula One World Drivers' Championship titles and—at the time of his retirement—held the records for most wins (51), fastest laps (41), and podium finishes (106).<br><br>In 1985, Prost won his maiden title with McLaren, becoming the first World Drivers' Champion from France.`;

    function openReader(title, imageSrc) {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('reader-view').style.display = 'block';
        document.getElementById('content-reader').style.display = 'block';
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-image').src = imageSrc;
        document.getElementById('reader-body').innerHTML = getContent(title);
        window.scrollTo(0, 0);
    }

    function closeReader() {
        document.getElementById('reader-view').style.display = 'none';
        document.getElementById('content-reader').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
    }
