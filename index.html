<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="DuDfJ88tjBjyCR5xttbIUU4ZP0PENWgawbM3bxA3F30" />
    <title>THE APEX | Motorsport & Engineering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #f8f9fa; font-family: 'Helvetica Neue', sans-serif; }
        .navbar { border-bottom: 2px solid #dc3545; }
        .navbar-brand { font-weight: 900; letter-spacing: 2px; }
        .card { background-color: #1e1e1e; border: none; transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); }
        .card-title { font-weight: bold; }
        .badge-cat { position: absolute; top: 10px; right: 10px; font-size: 0.8rem; padding: 5px 10px; }
        #content-reader { display: none; background: #1e1e1e; padding: 30px; border-radius: 10px; margin-top: 20px; }
        .btn-danger { background-color: #dc3545; border: none; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1614200187524-dc4b892acf16?q=80&w=2000&auto=format&fit=crop') center/cover; padding: 100px 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand text-danger fs-3" href="#">THE APEX</a>
    </div>
</nav>

<div id="main-view">
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">UNCOMPROMISED MOTORSPORT ENGINEERING</h1>
            <p class="lead mb-4">Deep dive telemetry, aerodynamic analysis, and the raw mechanics of speed.</p>
            
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <button class="btn btn-dark fw-bold px-4 py-2" onclick="filterCategory('All')">MASTER ARCHIVE</button>
                <button class="btn btn-danger fw-bold px-4 py-2" onclick="filterCategory('F1')">F1 PADDOCK</button>
                <button class="btn btn-danger fw-bold px-4 py-2" onclick="filterCategory('Supercars')">SUPERCAR LAB</button>
                <button class="btn btn-danger fw-bold px-4 py-2" onclick="filterCategory('Drivers')">F1 DRIVERS</button>
            </div>
        </div>
    </div>

    <div class="container mt-5 mb-5">
        <div class="row g-4" id="main-grid"></div>

        <h3 id="drivers-title" class="mt-5 mb-4 fw-bold text-light border-bottom border-danger pb-2" style="display: none;">F1 LEGENDS</h3>
        <div class="row g-4" id="drivers-grid"></div>
    </div>
</div>

<div class="container pb-5" id="reader-view" style="display: none;">
    <button class="btn btn-outline-light mb-4 mt-4" onclick="closeReader()">← Back to Grid</button>
    <div id="content-reader">
        <img id="reader-image" src="" class="img-fluid rounded mb-4" style="max-height: 500px; width: 100%; object-fit: cover;">
        <h1 id="reader-title" class="fw-bold mb-3"></h1>
        <div id="reader-body" class="fs-5" style="line-height: 1.8;"></div>
    </div>
</div>

<script>
    const blogPosts = [
        
        // ==========================================
        // PASTE YOUR 22 ORIGINAL POSTS HERE
        // ==========================================
        
        // Example: {"title": "F1 2026: Active Aero Modes", "cat": "F1", "image": "YOUR_LINK"},

        // ==========================================
        // LEAVE THESE DRIVERS AT THE BOTTOM
        // ==========================================
        {"title": "Niki Lauda: The Ultimate Comeback", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/N/NIKLAU01_Niki_Lauda/niklau01.png.transform/2col/image.png"},
        {"title": "Max Verstappen: The Dutch Era", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto,c_limit,w_1440,q_auto/f_auto/q_auto/content/dam/fom-website/drivers/M/MAXVER01_Max_Verstappen/maxver01.png.transform/2col/image.png"},
        {"title": "James Hunt: The Shunt", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/J/JAMHUN01_James_Hunt/jamhun01.png.transform/2col/image.png"},
        {"title": "Sebastian Vettel: The Youngest Champion", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677249684/content/dam/fom-website/drivers/S/SEBVET01_Sebastian_Vettel/sebvet01.png.transform/2col/image.png"},
        {"title": "Ayrton Senna: The Imola Legend", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244984/content/dam/fom-website/drivers/A/AYRSEN01_Ayrton_Senna/ayrsen01.png.transform/2col/image.png"},
        {"title": "Alain Prost: The Professor", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/A/ALAPRO01_Alain_Prost/alapro01.png.transform/2col/image.png"}
    ];

    function createCardHTML(post) {
        // This is your EXACT original card layout and 200px styling
        return `
        <div class="col-md-4">
            <div class="card h-100 text-light overflow-hidden" onclick="openReader('${post.title}', '${post.image}')">
                <span class="badge bg-danger badge-cat">${post.cat}</span>
                <img src="${post.image}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">${post.title}</h5>
                </div>
            </div>
        </div>`;
    }

    function filterCategory(cat) {
        const mainGrid = document.getElementById('main-grid');
        const driversGrid = document.getElementById('drivers-grid');
        const driversTitle = document.getElementById('drivers-title');

        mainGrid.innerHTML = '';
        driversGrid.innerHTML = '';

        if (cat === 'All') {
            driversTitle.style.display = 'block';
            const mainPosts = blogPosts.filter(post => post.cat !== 'Drivers');
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            
            mainPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else if (cat === 'Drivers') {
            driversTitle.style.display = 'block';
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else {
            driversTitle.style.display = 'none';
            const filteredPosts = blogPosts.filter(post => post.cat === cat);
            filteredPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
        }
    }

    function getContent(title) {
        
        // --- DRIVER BIOS ---
        if (title.includes("Niki Lauda")) return `<b>Andreas Nikolaus "Niki" Lauda (1949 – 2019)</b><br><br>An Austrian racing driver, motorsport executive, and aviation entrepreneur, who competed in Formula One from 1971 to 1979 and from 1982 to 1985. Lauda won three Formula One World Drivers' Championship titles and—at the time of his retirement—held the record for most podium finishes (54).`;
        if (title.includes("Max Verstappen")) return `<b>Max Emilian Verstappen (Born 1997)</b><br><br>A Dutch and Belgian racing driver who competes under the Dutch flag in Formula One for Red Bull Racing. Verstappen has won four Formula One World Drivers' Championship titles, which he won consecutively from 2021 to 2024 with Red Bull, and has won 71 Grands Prix across 12 seasons.`;
        if (title.includes("James Hunt")) return `<b>James Simon Wallis Hunt (1947 – 1993)</b><br><br>A British racing driver and broadcaster who competed in Formula One from 1973 to 1979. Nicknamed "the Shunt", Hunt won the Formula One World Drivers' Championship in 1976 with McLaren and won 10 Grands Prix across seven seasons.`;
        if (title.includes("Sebastian Vettel")) return `<b>Sebastian Vettel</b><br><br>A German racing driver who competed in Formula One from 2007 to 2022. Vettel won four Formula One World Drivers' Championship titles, which he won consecutively from 2010 to 2013 with Red Bull, and remains the youngest-ever World Drivers' Champion; he won 53 Grands Prix across 16 seasons.`;
        if (title.includes("Ayrton Senna")) return `<b>Ayrton Senna da Silva (1960 – 1994)</b><br><br>A Brazilian racing driver who competed in Formula One from 1984 to 1994. Senna won three Formula One World Drivers' Championship titles with McLaren, and—at the time of his death—held the record for most pole positions (65).`;
        if (title.includes("Alain Prost")) return `<b>Alain Marie Pascal Prost (Born 1955)</b><br><br>A French former racing driver and motorsport executive, who competed in Formula One from 1980 to 1993. Nicknamed "the Professor", Prost won four Formula One World Drivers' Championship titles.`;

        // ==========================================
        // PASTE YOUR ORIGINAL ARTICLE TEXT LOGIC HERE
        // (if (title.includes("...")) return "..."; )
        // ==========================================

        return "Full article content coming soon.";
    }

    function openReader(title, imageSrc) {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('reader-view').style.display = 'block';
        document.getElementById('content-reader').style.display = 'block';
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-image').src = imageSrc;
        document.getElementById('reader-body').innerHTML = getContent(title);
        window.scrollTo(0, 0);
    }

    function closeReader() {
        document.getElementById('reader-view').style.display = 'none';
        document.getElementById('content-reader').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
    }

    filterCategory('All');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
