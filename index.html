<div id="main-view">

            <h1 class="display-4 fw-bold">UNCOMPROMISED MOTORSPORT ENGINEERING</h1>

    <div class="container mt-5 mb-5">

<div class="container pb-5" id="reader-view" style="display: none;">

        <div id="reader-body" class="fs-5" style="line-height: 1.8; white-space: pre-line; text-align: justify; color: #ddd;"></div>

        {"id": 7, "title": "Lewis Hamilton: The Ferrari SF-26 Red Synergy", "cat": "F1", "image": "https://cdn-8.motorsport.com/images/amp/68yGx840/s6/lewis-hamilton-ferrari-sf-25-3.jpg"},
        {"id": 8, "title": "Aventador SVJ: Bending Physics with ALA 2.0", "cat": "Reviews", "image": "https://www.lamborghini.com/sites/it-en/files/DAM/lamborghini/news/Meet%20Aventador/Cover.jpg"},

        {"id": 10, "title": "Porsche GT3 RS: Pure DRS Logic Explained", "cat": "Reviews", "image": "https://a.storyblok.com/f/322327/1700x1300/dbca0a4fd0/cz23v20ox0040-911-gt3-rs-front.jpg"},
        {"id": 11, "title": "Ground Effect: The Magic of Venturi Tunnels", "cat": "F1", "image": "https://d35351qr6sqxto.cloudfront.net/blogs/bhdkQ9PnSyzmdH1wkSoZsAB4BoC1uYLtVmk.jpeg"},
        {"id": 12, "title": "F1 2026: 100% Sustainable Fuels Are Coming", "cat": "Daily", "image": "https://media.formula1.com/image/upload/t_16by9Centre/c_lfill,w_3392/q_auto/v1740000001/fom-website/campaign/ESG/Aramco%20advanced%20fuel.webp"},
        {"id": 13, "title": "Manual Gearbox: Saving the Analog Soul", "cat": "Daily", "image": "https://static0.hotcarsimages.com/wordpress/wp-content/uploads/2020/06/Gated-Shifter.jpg"},

        {"id": 15, "title": "Inside the McLaren MTC Wind Tunnel", "cat": "Daily", "image": "https://media.formula1.com/image/upload/c_lfill,w_3392/q_auto/v1740000001/content/dam/fom-website/manual/Misc/2019-Races/summer-break-2019/McLaren-MTC-wind-tunnel.webp"},
        {"id": 16, "title": "Suspension Setup: What is Anti-Dive Control?", "cat": "Daily", "image": "https://i0.wp.com/suspensionsecrets.co.uk/wp-content/uploads/2018/08/anti-dive-1.jpg?resize=750%2C500"},
        {"id": 17, "title": "Audi F1: Tracking the Neuburg Infrastructure", "cat": "F1", "image": "https://media.formula1.com/image/upload/c_lfill,w_2048/q_auto/v1740000001/fom-website/2026/Audi/16x9%20single%20image%20(41).webp"},

        {"id": 19, "title": "F1 Cost Cap: Preventing Clever IP Leakage", "cat": "F1", "image": "https://media.formula1.com/image/upload/c_lfill,w_3392/q_auto/v1740000001/fom-website/2025/Miscellaneous/GettyImages-2169727936.webp"},
        {"id": 20, "title": "BMW S58 Engine: Built for Endless Abuse", "cat": "Daily", "image": "https://cdn.bmwblog.com/wp-content/uploads/2020/09/2021-bmw-m4-competition-exterior-37.jpg"},
        {"id": 21, "title": "Advanced Composites: How the Bio-Resin Cycle Works", "cat": "Tech", "image": "https://images.ctfassets.net/1fvlg6xqnm65/1Vo9OYscR8ggC1RVzYqjWl/9806e4d885f5dbedd370ad7cd7a4b066/Bio-Resin-WEB-IMAGE-2.jpg?w=1920&q=75&fm=webp"},
        {"id": 22, "title": "F1 2026: Active Aero Modes (X-Mode vs Z-Mode)", "cat": "F1", "image": "https://cdn.motorsport.com/images/mgl/YpNMjxZ0/s1000/f1-2026-fia-car-renders.jpg"},
        
        // ==========================================
        // THE 6 NEW F1 LEGENDS
        // ==========================================
        {"id": 23, "title": "Niki Lauda: The Ultimate Comeback", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/N/NIKLAU01_Niki_Lauda/niklau01.png.transform/2col/image.png"},
        {"id": 24, "title": "Max Verstappen: The Dutch Era", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto,c_limit,w_1440,q_auto/f_auto/q_auto/content/dam/fom-website/drivers/M/MAXVER01_Max_Verstappen/maxver01.png.transform/2col/image.png"},
        {"id": 25, "title": "James Hunt: The Shunt", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/J/JAMHUN01_James_Hunt/jamhun01.png.transform/2col/image.png"},
        {"id": 26, "title": "Sebastian Vettel: The Youngest Champion", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677249684/content/dam/fom-website/drivers/S/SEBVET01_Sebastian_Vettel/sebvet01.png.transform/2col/image.png"},
        {"id": 27, "title": "Ayrton Senna: The Imola Legend", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244984/content/dam/fom-website/drivers/A/AYRSEN01_Ayrton_Senna/ayrsen01.png.transform/2col/image.png"},
        {"id": 28, "title": "Alain Prost: The Professor", "cat": "Drivers", "image": "https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/drivers/A/ALAPRO01_Alain_Prost/alapro01.png.transform/2col/image.png"}
    ];

    function createCardHTML(post) {
        return `
        <div class="col-md-4">
            <div class="card h-100 text-light overflow-hidden" onclick="openReader('${post.title.replace(/'/g, "\\'")}', '${post.image}')" style="border: 1px solid #222;">
                <span class="badge bg-danger badge-cat">${post.cat}</span>
                <img src="${post.image}" class="card-img-top" style="height: 200px; object-fit: cover; border-bottom: 3px solid #e10600;">
                <div class="card-body">
                    <h5 class="card-title">${post.title}</h5>
                </div>
            </div>
        </div>`;
    }

    function filterCategory(cat) {
        const mainGrid = document.getElementById('main-grid');
        const driversGrid = document.getElementById('drivers-grid');
        const driversTitle = document.getElementById('drivers-title');

        mainGrid.innerHTML = '';
        driversGrid.innerHTML = '';

        if (cat === 'All') {
            driversTitle.style.display = 'block';
            const mainPosts = blogPosts.filter(post => post.cat !== 'Drivers');
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            
            mainPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else if (cat === 'Drivers') {
            driversTitle.style.display = 'block';
            const driverPosts = blogPosts.filter(post => post.cat === 'Drivers');
            driverPosts.forEach(post => driversGrid.innerHTML += createCardHTML(post));
            
        } else {
            driversTitle.style.display = 'none';
            const filteredPosts = blogPosts.filter(post => post.cat === cat);
            filteredPosts.forEach(post => mainGrid.innerHTML += createCardHTML(post));
        }
    }

    function getContent(title) {
        title = title.toUpperCase();

        // 1. DEDICATED LANDING ARCHIVE CONTENT
        if (title.includes("WELCOME")) {
            return `Welcome to THE APEX—a digital notebook, racing journal, and performance archive built entirely for the hardcore car nerds and paddock lifers. This platform exists because looking at a car from the outside is never enough; we want to understand the mechanical soul, the aerodynamics, and the human grit that pushes these machines to the ragged edge.\n\nWhat do we cover here? Everything that sets an enthusiast's mind on fire. From the complex aerodynamics of ground-effect venturi tunnels to the pure engineering genius of Bugatti's new V16 engine, we break down the science of speed without the dry, boring textbook language. We cover F1 technical updates, deep-dive hypercar reviews, analog manual gearboxes, and the raw dynamics of suspension geometry. If it makes a car faster, louder, or more rewarding to drive, it gets a dossier on this grid.\n\nAbout the founder: THE APEX was created by Avyay Jha, an active car enthusiast and petrolhead who lives for high-performance engineering. Whether it's dissecting the active aerodynamics of a Lamborghini Aventador SVJ, tracking the extreme limits of a McLaren track weapon, or following the psychological chess match of the F1 paddock, this archive is a reflection of a personal obsession with automotive evolution. This is a space built by a car nerd, for car nerds. Welcome to the grid.`;
        }

        // 2. F1 LEGENDS & DRIVER DOSSIERS
        if (title.includes("NIKI LAUDA")) return `Andreas Nikolaus 'Niki' Lauda (22 February 1949 – 20 May 2019) was an Austrian racing driver, motorsport executive, and aviation entrepreneur. He competed in Formula One from 1971 to 1979 and 1982 to 1985. Lauda won three Formula One World Drivers' Championship titles and remains the only driver to have won a World Championship with both Ferrari and McLaren.\n\nWhile leading the 1976 championship, Lauda was seriously injured at the Nürburgring, suffering severe burns when his Ferrari 312T2 caught fire. He astonishingly returned to racing just six weeks later.`;
        if (title.includes("MAX VERSTAPPEN")) return `Max Emilian Verstappen (born 30 September 1997) is a Dutch and Belgian racing driver competing for Red Bull Racing. Verstappen has won four consecutive Formula One World Drivers' Championship titles from 2021 to 2024, securing 71 Grands Prix victories across 12 seasons.\n\nHe won his maiden title in 2021 after a dramatic final-lap overtake on Lewis Hamilton, becoming the first Dutch World Champion. He continued to dominate in 2022 and 2023, breaking numerous historical F1 records along the way.`;
        if (title.includes("JAMES HUNT")) return `James Simon Wallis Hunt (29 August 1947 – 15 June 1993) was a British racing driver and broadcaster. Nicknamed 'the Shunt', Hunt won the Formula One World Drivers' Championship in 1976 with McLaren. Known for his reckless and action-packed exploits on track and his playboy lifestyle off it, he secured 10 race wins, 14 pole positions, and 23 podiums before retiring after the 1979 Monaco Grand Prix.`;
        if (title.includes("SEBASTIAN VETTEL")) return `Sebastian Vettel is a German racing driver who competed in Formula One from 2007 to 2022. Vettel won four consecutive Formula One World Drivers' Championship titles from 2010 to 2013 with Red Bull. He remains the youngest-ever World Drivers' Champion, achieving the feat at age 23.\n\nWith 53 Grands Prix victories across 16 seasons, Vettel established himself as one of the most dominant drivers of the modern V8 aerodynamic era before moving on to Ferrari and Aston Martin.`;
        if (title.includes("AYRTON SENNA")) return `Ayrton Senna da Silva (21 March 1960 – 1 May 1994) was a Brazilian racing driver who won three Formula One World Drivers' Championship titles with McLaren. He won 41 Grands Prix and held the record for most pole positions (65) at the time of his death.\n\nTragically, Senna was killed in a crash while leading the 1994 San Marino Grand Prix at Imola. His death sent shockwaves through the sporting world, leading to sweeping safety reforms in Formula One.`;
        if (title.includes("ALAIN PROST")) return `Alain Marie Pascal Prost (born 24 February 1955) is a French former racing driver and motorsport executive. Nicknamed 'the Professor' for his intellectual and smooth approach to racing, Prost won four Formula One World Drivers' Championship titles.\n\nAt the time of his retirement, he held the records for most wins (51), fastest laps (41), and podium finishes (106). He secured his maiden title with McLaren in 1985, becoming the first French World Champion.`;

        // 3. CHARACTER-DRIVEN DOSSIERS
        if (title.includes("ANTONELLI") || title.includes("HAMILTON") || title.includes("WOLFF")) {
            return `The real human drama of Formula 1 completely takes over when you look at the story behind this paddock hero. We can argue about sidepod packaging and floor edge stiffness all weekend, but when the lights go out, the most volatile, unpredictable element in the cockpit is always the driver wrestling the machine.\n\nTake Kimi Antonelli—you are watching the explosive arrival of a true generational prodigy. Skipping F3 entirely isn't just a bold move; it's a massive statement of intent by Mercedes. The paddock is completely transfixed by this kid because his raw junior telemetry shows a level of corner-entry commitment and wet-weather feel that you simply cannot teach. Straining against massive G-forces while keeping a modern F1 car balanced on a knife-edge requires insane psychological armor, especially when you're stepping directly into the shadow of a legend.\n\nAnd then you look across the paddock at the seismic reality of Lewis Hamilton strapping into a Scuderia Ferrari. That isn't a standard career move; it's an existential quest for motorsport immortality. Hamilton leaving his lifelong Mercedes comfort zone to face the absolute colosseum of Maranello shows the kind of unyielding competitive fire that defines an icon. He’s stepping into the eye of the storm under the intense pressure of the Tifosi, proving that the human spirit and raw racing instinct still dictate the grid.`;
        }

        // 4. ADUO CRACKDOWN SPECIFIC
        if (title.includes("ADUO REGS")) {
            return `The ADUO regulations were supposed to level the playing field, but F1 engineers always find the gray areas. By manipulating the combustion timing and energy recovery deployment cycles, teams found a smart engine loophole to extract massive, unregulated bursts of horsepower out of slow-speed traction zones.\n\n<b>The FIA Crackdown</b>\nHowever, the governing body has caught on to the telemetry spikes. The FIA has officially announced that they will intervene and completely ban these specific engine loopholes, forcing teams to rewrite their deployment maps and shutting down the free horsepower advantage.`;
        }

        // 5. COMPACT, VARIABLE INTROS FOR TECHNICAL REVIEWS
        let intro = `The sheer engineering execution behind this machine represents an absolute weapon built for those who live for mind-bending performance.`;
        if (title.includes("BUGATTI")) intro = `The absolute madness of this build proves that the mechanical internal combustion engine isn't going down without a spectacular, high-RPM fight.`;
        else if (title.includes("AVENTADOR")) intro = `When you watch this beast tear up a circuit, you are looking at a masterclass in aggressive engineering and raw, active aerodynamic manipulation.`;
        else if (title.includes("MCLAREN")) intro = `The development path of this chassis shows exactly what happens when a design team becomes completely obsessed with lightweight track violence.`;

        return `${intro} If you are a petrolhead who lives for cutting-edge dynamics, this is exactly where design hits pure, sanity-testing speed. We aren't just looking at generic zero-to-hundred stats or glossy body panels here; we are dissecting the actual backbone of the machine.\n\nLet's talk about the cornering dynamics. The engineers have dialed in the suspension kinematics to aggressively fight off lateral loading. When you drop this beast into a high-speed apex, the structural stiffness keeps the contact patches completely glued to the tarmac. With virtually zero body roll, you get immediate mechanical feedback and the kind of steering precision that makes you feel connected directly to the hub carriers.\n\nBut raw grip is useless if your powertrain cooks itself. The thermal management on this setup is brilliant. Running flat out dumps a ridiculous amount of thermal energy, and to keep performance from dropping off a cliff, specialized high-efficiency cooling loops, raw radiator ducts, and active louvers work together to extract heat from the engine bay while maintaining clean, uncompromised airflow over the bodywork.\n\nFinally, the aerodynamics are pure black magic. Instead of relying on a massive, drag-heavy rear wing, the underbody utilizes deep venturi tunnels to create a massive low-pressure vacuum, literally sucking the floor down into the asphalt. Throw in active aero elements that flatten out on the straights to maximize top speed, and you get a machine that slips through the air on the straights but drops an absolute anvil of downforce the second you smash the brakes for a tight bend.`;
    }

    function openReader(title, imageSrc) {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('reader-view').style.display = 'block';
        document.getElementById('content-reader').style.display = 'block';
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-image').src = imageSrc;
        document.getElementById('reader-body').innerHTML = getContent(title);
        window.scrollTo(0, 0);
    }

    function closeReader() {
        document.getElementById('reader-view').style.display = 'none';
        document.getElementById('content-reader').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
    }

    // Initialize the grid layout
    filterCategory('All');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
